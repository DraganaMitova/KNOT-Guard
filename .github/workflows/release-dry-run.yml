name: Release Dry Run

on:
  pull_request:
  push:
    branches:
      - stable-prod

permissions:
  contents: read

jobs:
  package:
    name: Package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build package
        run: npm --workspace @knot/guard run build

      - name: Check lifecycle hooks
        run: npm run security:package

      - name: Pack dry run
        run: npm --workspace @knot/guard pack --dry-run
